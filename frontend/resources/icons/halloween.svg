<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Retake Gym app icon "halloween", drawn by hand (scripts/app-icons.mjs renders it, it does not
       write it). The mark of resources/icon.svg in pumpkin orange, its nib lit from inside like a
       jack-o'-lantern; around it a purple night, a crescent moon and a spider on its thread. Only rect, circle,
       line, polyline, polygon and one radialGradient: what the script knows how to draw. -->
  <defs>
    <radialGradient id="night" gradientUnits="userSpaceOnUse" cx="256" cy="300" r="380">
      <stop offset="0" stop-color="#3d1a63"/>
      <stop offset="1" stop-color="#0d0517"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#night)"/>
  <!-- Everything that matters stays within 228 of the centre: Android cuts the art to a circle and
       only promises the middle 66 dp of its 72, and iOS rounds the corners off. -->
  <!-- the moon: a pale disc with the night bitten out of it -->
  <circle cx="130" cy="130" r="36" fill="#f7e8b4"/>
  <circle cx="148" cy="118" r="32" fill="url(#night)"/>
  <g fill="#f7e8b4">
    <circle cx="380" cy="80" r="6"/>
    <circle cx="110" cy="300" r="4"/>
    <circle cx="66" cy="236" r="4"/>
  </g>
  <!-- the spider, down its thread to the right of the bar -->
  <line x1="420" y1="60" x2="420" y2="234" stroke="#b7a2de" stroke-width="4"/>
  <g stroke="#ecdfff" stroke-width="4.5">
    <polyline points="413.6,240.4 402.4,232.4 397.6,240.4"/>
    <polyline points="426.4,240.4 437.6,232.4 442.4,240.4"/>
    <polyline points="413.6,245.2 399.2,243.6 394.4,253.2"/>
    <polyline points="426.4,245.2 440.8,243.6 445.6,253.2"/>
    <polyline points="414.4,250 402.4,254.8 400.8,264.4"/>
    <polyline points="425.6,250 437.6,254.8 439.2,264.4"/>
  </g>
  <g fill="#ecdfff">
    <circle cx="420" cy="237.2" r="7.2"/>
    <circle cx="420" cy="250" r="10.4"/>
  </g>
  <!-- the mark, pumpkin orange, the nib's hole glowing -->
  <line x1="307.9" y1="162.5" x2="307.9" y2="271.4" stroke="#ff7a1a" stroke-width="6.1"/>
  <line x1="227.4" y1="130.4" x2="227.4" y2="202.8" stroke="#ff7a1a" stroke-width="6.1"/>
  <line x1="208.3" y1="130.4" x2="227.4" y2="130.4" stroke="#ff7a1a" stroke-width="6.1"/>
  <line x1="208.3" y1="98.2" x2="208.3" y2="130.4" stroke="#ff7a1a" stroke-width="6.1"/>
  <line x1="258.1" y1="120.4" x2="258.1" y2="202.8" stroke="#ff7a1a" stroke-width="6.1"/>
  <line x1="258.1" y1="120.4" x2="290.3" y2="120.4" stroke="#ff7a1a" stroke-width="6.1"/>
  <circle cx="307.9" cy="161" r="12.3" fill="#ff7a1a"/>
  <circle cx="208.3" cy="98.2" r="12.3" fill="#ff7a1a"/>
  <circle cx="290.3" cy="120.4" r="12.3" fill="#ff7a1a"/>
  <line x1="132.8" y1="203.2" x2="379.2" y2="203.2" stroke="#ff7a1a" stroke-width="8.6"/>
  <rect x="161.6" y="158.3" width="18.4" height="89.8" fill="#ff7a1a"/>
  <rect x="332" y="158.3" width="18.4" height="89.8" fill="#ff7a1a"/>
  <rect x="144.3" y="170.9" width="15" height="64.5" fill="#ff7a1a"/>
  <rect x="352.7" y="170.9" width="15" height="64.5" fill="#ff7a1a"/>
  <rect x="182.3" y="190.5" width="5.2" height="25.3" fill="#ff7a1a"/>
  <rect x="324.5" y="190.5" width="5.2" height="25.3" fill="#ff7a1a"/>
  <polygon points="255.7,242.9 205.1,369.6 232,426.3 289.1,426.3 311.6,369.5 261,242.9" fill="#ff7a1a"/>
  <rect x="256.7" y="234.4" width="3.2" height="104.8" fill="#0d0517"/>
  <circle cx="258.3" cy="353" r="15.6" fill="#ffd166"/>
</svg>
