<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('Retake Gym could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('Retake Gym could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'Retake Gym could not start on this browser.' : 'Retake Gym is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>Retake Gym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c1324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retake Gym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen is the logo loading its plates instead of a black
     page. Retake Gym: the Retake symbol in gold on navy, like the app icon. lib/boot.js takes it away the moment the
     app can draw, so it never adds a wait. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#0c1324;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot svg{width:96px;height:auto;overflow:visible}
  #boot .db{animation:boot-in .5s cubic-bezier(.3,.7,.4,1) both,boot-rep 1.25s ease-in-out .75s infinite}
  #boot rect,#boot ellipse{transform-box:fill-box;transform-origin:center}
  #boot .bar{animation:boot-bar .32s cubic-bezier(.3,.7,.4,1) both}
  #boot .pl{animation:boot-plate .28s cubic-bezier(.3,.7,.4,1.3) both}
  #boot .pr{animation:boot-plate-r .28s cubic-bezier(.3,.7,.4,1.3) both}
  #boot .in{animation-delay:.22s}
  #boot .outer{animation-delay:.36s}
  #boot ellipse{fill:#e8cc85;opacity:.12;animation:boot-shadow 1.25s ease-in-out .75s infinite}
  @keyframes boot-bar{from{transform:scaleX(0)}}
  @keyframes boot-plate{from{transform:translateX(-40px);opacity:0}}
  @keyframes boot-plate-r{from{transform:translateX(40px);opacity:0}}
  @keyframes boot-in{from{opacity:0;transform:scale(.9)}}
  @keyframes boot-rep{50%{transform:translateY(-14px)}}
  @keyframes boot-shadow{50%{transform:scaleX(.72);opacity:.05}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#e6e8ec;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#1a1d24;color:#a9b0bc;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#0c0e12;background:#e8cc85;border:0;border-radius:12px;min-height:44px;padding:0 28px}
  @media (prefers-reduced-motion:reduce){
    #boot .bar,#boot .pl,#boot .pr,#boot ellipse{animation:none}
    #boot .db{animation:boot-breathe 1.6s ease-in-out infinite}
    @keyframes boot-breathe{50%{opacity:.55}}
  }
</style>
<div id="boot" aria-hidden="true">
  <svg viewBox="144 62 468 671">
    <ellipse cx="378" cy="715" rx="149.76" ry="8"/>
    <g class="db"><g fill="none" stroke="#e8cc85"><line x1="468.18" y1="215" x2="468.18" y2="404.25" stroke-width="10.66" stroke-linecap="round"/><line x1="328.36" y1="159.23" x2="328.36" y2="280" stroke-width="10.66" stroke-linecap="round"/><line x1="295.07" y1="159.23" x2="328.36" y2="159.23" stroke-width="10.66" stroke-linecap="round"/><line x1="295.07" y1="103.31" x2="295.07" y2="159.23" stroke-width="10.66" stroke-linecap="round"/><line x1="381.63" y1="144.59" x2="381.63" y2="280" stroke-width="10.66" stroke-linecap="round"/><line x1="381.63" y1="141.92" x2="437.56" y2="141.92" stroke-width="10.66" stroke-linecap="round"/></g><g fill="#e8cc85"><circle cx="468.18" cy="212.5" r="21.31"/><circle cx="295.07" cy="103.31" r="21.31"/><circle cx="437.56" cy="141.92" r="21.31"/></g><g fill="#e8cc85" stroke="#e8cc85"><line x1="164" y1="285.74" x2="592" y2="285.74" stroke-width="15" stroke-linecap="round"/><g stroke="none"><rect x="214" y="207.74" width="32" height="156" rx="7"/><rect x="184" y="229.74" width="26" height="112" rx="7"/><rect x="250" y="263.74" width="9" height="44" rx="3"/><rect x="510" y="207.74" width="32" height="156" rx="7"/><rect x="546" y="229.74" width="26" height="112" rx="7"/><rect x="497" y="263.74" width="9" height="44" rx="3"/></g></g><path fill="#e8cc85" d="M377.35,519.33l1.94-2.31v-159.95s-1.9-2.3-1.9-2.3l-2.62,1.44-85.31,217.63.06,1.86,45.74,96.95,2.14,1.34h96.93s2.2-1.49,2.2-1.49l38.04-96.93v-1.73s-85.29-217.62-85.29-217.62l-2.63-1.45-1.92,2.31v159.93s1.95,2.31,1.95,2.31c12.73,2.22,22.42,13.27,22.43,26.62-.03,14.97-12.13,27.07-27.1,27.1-14.96-.04-27.05-12.14-27.09-27.09,0-13.36,9.69-24.4,22.43-26.62Z"/></g>
  </svg>
</div>
